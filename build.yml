name: Build MV CHOIR LAB

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1 | Copy-Item -Destination dist -Recurse
          Get-ChildItem -Path dist -Recurse | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: MV-CHOIR-LAB-Windows
          path: dist
